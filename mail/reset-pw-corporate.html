<!doctype html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>한국로날드맥도날드하우스 - 임시 비밀번호 안내</title>
    <style type="text/css">
      body,
      p,
      h1,
      h2,
      h3,
      table,
      td,
      a {
        margin: 0;
        padding: 0;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      table {
        border-collapse: collapse;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }

      img {
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
        -ms-interpolation-mode: bicubic;
      }

      @media only screen and (max-width: 640px) {
        .mail-container {
          width: 100% !important;
          max-width: 100% !important;
        }

        .mail-card {
          padding: 40px 20px !important;
        }

        .mail-logo {
          width: 96px !important;
          height: auto !important;
        }

        .mail-title {
          font-size: 20px !important;
          padding-bottom: 24px !important;
        }

        .mail-body {
          font-size: 14px !important;
        }

        .password-label {
          font-size: 17px !important;
          padding: 14px 0 !important;
        }

        .password-value {
          font-size: 24px !important;
          padding: 24px 8px !important;
        }

        .mail-btn-wrap {
          padding-top: 40px !important;
          padding-bottom: 40px !important;
        }

        .mail-btn {
          padding: 12px 28px !important;
          font-size: 15px !important;
        }

        .mail-divider-wrap {
          padding-bottom: 40px !important;
        }

        .mail-footer {
          font-size: 11px !important;
        }
      }
    </style>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      width: 100% !important;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      background-color: #faf8f5;
      font-family:
        &quot;Pretendard&quot;,
        -apple-system,
        BlinkMacSystemFont,
        &quot;Apple SD Gothic Neo&quot;,
        &quot;Malgun Gothic&quot;,
        &quot;맑은 고딕&quot;,
        helvetica,
        sans-serif;
      color: #21272a;
      word-break: keep-all;
    "
  >
    <table
      role="presentation"
      width="100%"
      border="0"
      cellpadding="0"
      cellspacing="0"
      bgcolor="#faf8f5"
      style="
        background-color: #faf8f5;
        width: 100%;
        margin: 0;
        padding: 0;
        table-layout: fixed;
      "
    >
      <tr>
        <td align="center" style="padding: 40px 16px 48px 16px">
          <table
            role="presentation"
            class="mail-container"
            width="100%"
            border="0"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 800px; width: 100%; margin: 0 auto"
          >
            <tr>
              <td
                bgcolor="#fffde9"
                class="mail-card"
                style="
                  background-color: #fffde9;
                  border: 1px solid #ebe5d8;
                  border-radius: 20px;
                  padding: 80px 60px 80px 60px;
                  text-align: left;
                "
              >
                <table
                  role="presentation"
                  width="100%"
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                >
                  <tr>
                    <td align="center" style="padding-bottom: 64px">
                      <a
                        href="https://rmhc.or.kr"
                        target="_blank"
                        style="text-decoration: none; display: inline-block"
                      >
                        <img
                          class="mail-logo"
                          src="/src/images/mail/img_mail_logo.png"
                          alt="Ronald McDonald House Korea"
                          width="120"
                          height="66"
                          border="0"
                          style="
                            display: block;
                            width: 120px;
                            height: 66px;
                            border: 0;
                            outline: none;
                            text-decoration: none;
                          "
                        />
                      </a>
                    </td>
                  </tr>

                  <tr>
                    <td
                      align="center"
                      class="mail-title"
                      style="
                        font-family:
                          &quot;Pretendard&quot;,
                          -apple-system,
                          BlinkMacSystemFont,
                          &quot;Apple SD Gothic Neo&quot;,
                          &quot;Malgun Gothic&quot;,
                          &quot;맑은 고딕&quot;,
                          sans-serif;
                        font-size: 28px;
                        font-weight: 700;
                        line-height: 1.3;
                        color: #121619;
                        padding-bottom: 64px;
                        text-align: center;
                        word-break: keep-all;
                      "
                    >
                      임시 비밀번호를 안내드립니다.
                    </td>
                  </tr>

                  <tr>
                    <td
                      align="center"
                      class="mail-body"
                      style="
                        font-family:
                          &quot;Pretendard&quot;,
                          -apple-system,
                          BlinkMacSystemFont,
                          &quot;Apple SD Gothic Neo&quot;,
                          &quot;Malgun Gothic&quot;,
                          &quot;맑은 고딕&quot;,
                          sans-serif;
                        font-size: 18px;
                        font-weight: 400;
                        line-height: 1.5;
                        color: #121619;
                        padding-bottom: 72px;
                        text-align: center;
                        word-break: keep-all;
                      "
                    >
                      비밀번호 재설정 요청에 따라 임시 비밀번호를 발급해
                      드렸습니다.<br />
                      아래 버튼을 눌러 로그인한 후 새로운 비밀번호로 변경해
                      주세요.
                    </td>
                  </tr>

                  <tr>
                    <td align="center" style="padding-bottom: 72px">
                      <table
                        role="presentation"
                        width="100%"
                        border="0"
                        cellpadding="0"
                        cellspacing="0"
                        style="
                          width: 100%;
                          border-top: 2px solid #121619;
                          border-collapse: collapse;
                        "
                      >
                        <tr>
                          <td
                            align="center"
                            class="password-label"
                            style="
                              padding: 20px 0;
                              font-family:
                                &quot;Pretendard&quot;,
                                -apple-system,
                                BlinkMacSystemFont,
                                &quot;Apple SD Gothic Neo&quot;,
                                &quot;Malgun Gothic&quot;,
                                &quot;맑은 고딕&quot;,
                                sans-serif;
                              font-size: 20px;
                              font-weight: 700;
                              color: #121619;
                              border-bottom: 1px solid #bbbbbb;
                              text-align: center;
                            "
                          >
                            임시 비밀번호
                          </td>
                        </tr>
                        <tr>
                          <td
                            align="center"
                            class="password-value"
                            style="
                              padding: 28px 12px;
                              background-color: #f5f3ef;
                              border: 1px solid #c9c9c9;
                              /* border-radius: 14px; */
                              font-family:
                                &quot;Pretendard&quot;,
                                -apple-system,
                                BlinkMacSystemFont,
                                &quot;Apple SD Gothic Neo&quot;,
                                &quot;Malgun Gothic&quot;,
                                &quot;맑은 고딕&quot;,
                                sans-serif;
                              font-size: 32px;
                              font-weight: 700;
                              line-height: 1.3;
                              color: #121619;
                              letter-spacing: 0.02em;
                              text-align: center;
                            "
                          >
                            {{temporaryPassword}}
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                  <tr>
                    <td
                      align="center"
                      class="mail-btn-wrap"
                      style="padding-bottom: 72px"
                    >
                      <table
                        role="presentation"
                        border="0"
                        cellpadding="0"
                        cellspacing="0"
                        style="margin: 0 auto"
                      >
                        <tr>
                          <td
                            align="center"
                            bgcolor="#db0007"
                            style="
                              border-radius: 6px;
                              background-color: #db0007;
                            "
                          >
                            <a
                              href="https://rmhc.or.kr/login/login.html"
                              target="_blank"
                              class="mail-btn"
                              style="
                                display: inline-block;
                                padding: 14px 36px;
                                font-family:
                                  &quot;Pretendard&quot;,
                                  -apple-system,
                                  BlinkMacSystemFont,
                                  &quot;Apple SD Gothic Neo&quot;,
                                  &quot;Malgun Gothic&quot;,
                                  &quot;맑은 고딕&quot;,
                                  sans-serif;
                                font-size: 18px;
                                color: #ffffff;
                                text-decoration: none;
                                border-radius: 6px;
                                letter-spacing: -0.02em;
                                border: 1px solid #db0007;
                              "
                            >
                              로그인하기
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                  <tr>
                    <td class="mail-divider-wrap" style="padding-bottom: 60px">
                      <table
                        role="presentation"
                        width="100%"
                        border="0"
                        cellpadding="0"
                        cellspacing="0"
                      >
                        <tr>
                          <td
                            style="
                              border-top: 1px solid #e5e0d8;
                              font-size: 0;
                              line-height: 0;
                              height: 1px;
                            "
                          >
                            &nbsp;
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                  <tr>
                    <td
                      class="mail-footer"
                      style="
                        font-family:
                          &quot;Pretendard&quot;,
                          -apple-system,
                          BlinkMacSystemFont,
                          &quot;Apple SD Gothic Neo&quot;,
                          &quot;Malgun Gothic&quot;,
                          &quot;맑은 고딕&quot;,
                          sans-serif;
                        font-size: 14px;
                        font-weight: 400;
                        line-height: 1.3;
                        color: #555555;
                        word-break: keep-all;
                      "
                    >
                      <p style="margin: 0 0 4px 0; padding: 0">
                        주소: 서울특별시 강남구 강남대로128길 10, 2층(논현동)
                        재단법인 한국로날드맥도날드하우스
                      </p>
                      <p style="margin: 0 0 4px 0; padding: 0">
                        후원문의·상담: 02-723-2013 / 상담시간 (월~금) 09:00 -
                        18:00
                      </p>
                      <p style="margin: 0; padding: 0">
                        본 메일은 발송 전용 메일입니다.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
