<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="인하대병원 내에 위치하여 장기 치료 중인 중증 환아와 가족들에게 따뜻한 쉼터를 제공하기 위해 준비 중인 RMHC 인하대 하우스입니다." />
  <title>인하대 하우스 - 한국로날드맥도날드하우스</title>
  <link rel="stylesheet" href="/src/css/common.css" />
  <link rel="stylesheet" href="/src/css/houses.css" />
</head>

<body>
  <!-- 웹 접근성 스킵 네비게이션 -->
  <a href="#main-content" class="skip-nav">본문 바로가기</a>

  <!-- 헤더 공통 영역 인클루드 -->
  <load src="/includes/header.html" />

  <div class="page-wrapper house-page">
    <main id="main-content">
      <section class="house-coming-section" aria-labelledby="houseComingTitle">
        <div class="house-coming-inner">
          
          <!-- 오픈 예정 뱃지 -->
          <div class="house-coming-badge" data-motion="fade-up">
            <img src="/src/images/houses/icon_coming.png" alt="coming" class="house-coming-badge__icon" />
            <span class="house-coming-badge__text">오픈 예정</span>
          </div>

          <!-- 메인 타이틀 -->
          <h1 id="houseComingTitle" class="house-coming-title" data-motion="fade-up" data-motion-delay="0.1">
            로날드 맥도날드 하우스 인하
          </h1>

          <!-- 안내 설명 문구 -->
          <p class="house-coming-desc" data-motion="fade-up" data-motion-delay="0.2">
            더 많은 환아와 가족이 함께할 수 있도록<br />
            로날드 맥도날드 하우스 인하를 준비하고 있습니다.<br />
            개관 일정 및 이용 안내는 추후 홈페이지를 통해<br class="type-mo" />
            안내드리겠습니다.
          </p>

          <!-- 현재 운영중인 하우스 카드 -->
          <div class="house-coming-card" data-motion="fade-up" data-motion-delay="0.3">
            <p class="house-coming-card__label">현재 운영중인 하우스</p>
            <a href="/houses/yangsan.html" class="house-coming-btn">
              <img src="/src/images/main/icon_section1_text_2.svg" alt="" class="house-coming-btn__icon" />
              <span class="house-coming-btn__text">로날드 맥도날드 하우스<br class="type-mo" /> 양산</span>
              <span class="house-coming-btn__arrow" aria-hidden="true">→</span>
            </a>
          </div>

        </div>
      </section>
    </main>
  </div>

  <!-- 푸터 공통 영역 인클루드 -->
  <load src="/includes/footer.html" />
</body>

</html>
