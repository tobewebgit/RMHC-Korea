<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="재단법인 한국로날드맥도날드하우스(RMHC Korea) 회원가입 완료 페이지입니다. 가입을 축하하며, 로그인하여 다양한 활동에 동참하세요."
    />
    <title>가입완료 - 한국로날드맥도날드하우스</title>
    <link rel="stylesheet" href="/src/css/common.css" />
    <link rel="stylesheet" href="/src/css/login.css" />
  </head>

  <body>
    <!-- 웹 접근성 스킵 네비게이션 -->
    <a href="#main-content" class="skip-nav">본문 바로가기</a>

    <!-- 헤더 공통 영역 인클루드 -->
    <load src="/includes/header.html" />

    <div class="page-wrapper">
      <main id="main-content" class="login-section flex-column">
        <div class="login-card join-card">
          <div class="icon-top">
            <img src="/src/images/login/icon-top-hands.svg" alt="" />
          </div>
          <h1 class="login-title small">
            반갑습니다! 로날드님 ,<br class="type-pc" />나눔의 여정에
            함께해주셔서 고맙습니다.
          </h1>
          <p class="login-desc small">
            당신의 따뜻한 마음은 환아 가족이 내일을 꿈꿀 수 있는 큰 힘이 됩니다.
          </p>

          <div class="button-wrap">
            <button type="submit" class="btn w-auto btn-primary">
              로그인 하기
            </button>
          </div>
        </div>

        <!-- 배너 (공통 donate-banner 컴포넌트) -->
        <section class="join-banner-section">
          <div class="donate-banner">
            <span class="donate-banner__heart" aria-hidden="true"></span>
            <div class="donate-banner__content">
              <h2>
                아이들의 곁을 지키는 특별한 기적, <br class="type-pc" />함께해
                주시겠어요?
              </h2>
            </div>
            <a href="#" class="btn btn-white btn-arrow donate-banner__btn"
              >하우스 둘러보기</a
            >
          </div>
        </section>
      </main>

      <!-- 푸터 공통 영역 인클루드 -->
      <load src="/includes/footer.html" />
    </div>
  </body>
</html>
